<div id="exercise2-container">
    <h1>Exercise 2: Palindrome Checker</h1>
    <button id="open-modal">Check Palindrome</button>


    <div id="token-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-modal">&times;</span>
            <h2>Paste Your Token</h2>
            <textarea id="token-textarea" rows="4" placeholder="Paste your JWT token here..."></textarea>
            <button id="submit-token">Submit Token</button>
        </div>
    </div>


    <div id="palindrome-container" style="display: none;">
        <h2>Check Palindrome</h2>
        <input type="text" id="palindrome-input" placeholder="Enter a word or phrase">
        <button id="check-palindrome">Check</button>
        <p id="result"></p>
    </div>
</div>

<script src="exercise2.js"></script>
</body>
