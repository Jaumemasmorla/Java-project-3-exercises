<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Authentication</title>
    <link rel="stylesheet" href="authenticate.css">
    <script src="authenticate.js" defer></script>
</head>
<body>
<nav class="navbar">
    <div class="navbar-brand">
        <h1>Exercises App</h1>
    </div>
    <ul class="navbar-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="exercise1.html">Exercise 1</a></li>
        <li><a href="exercise2.html">Palindrome</a></li>
        <li><a href="exercise3.html">Validate Brackets</a></li>
    </ul>
</nav>
<div class="container">
    <h2>Login</h2>
    <form id="login-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Login</button>
        <div class="message" id="message"></div>
    </form>
    <div id="token-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <h2>Authentication Successful!</h2>
            <p>Your JWT token:</p>
            <textarea id="token-textarea" readonly></textarea>
            <button id="copy-button">Copy Token</button>
        </div>
    </div>
</div>
</body>
</html>
